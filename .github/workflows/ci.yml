name: test

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit tests (no harness required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # pnpm is not on a GitHub runner by default; its absence was exit 127 on every
      # push, unnoticed because no run's conclusion was ever checked.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      # These drive apply() against mocks: a fake context, a fake WebSocket and a
      # fake fetch. They need no harness installation, which is why they run here.
      - run: pnpm install --frozen-lockfile=false
      # The suites are typechecked against the modules they import from dist/, so the build comes first.
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: node test/reconnect.test.ts
      - run: node test/core.test.ts
      - run: node test/recall.test.ts
      - run: node test/recall-context.test.ts
      - run: node test/notes.test.ts
      - run: node test/slack.test.ts
      - run: node test/edges.test.ts
      - run: node test/failures.test.ts
      - run: node test/resources.test.ts
      - run: node test/injection.test.ts
      - run: node test/usage.test.ts
      - run: node test/telegram.test.ts
      - run: node test/discord.test.ts
      - run: node test/progress.test.ts
      - run: node test/confined-runner.test.ts
      - run: node test/delivery.test.ts
      - run: node test/history.test.ts
      - run: node test/attachments.test.ts
      - run: node test/persona-check.test.ts
      - run: node test/watch.test.ts
      - run: node test/safe-write.test.ts
      - run: node test/health.test.ts
      - run: node test/secrets.test.ts .
      # The scenario harness (test/run-scenario.ts) boots a real profile and is
      # deliberately NOT run here: it needs a harness installation and a model
      # credential. Run it locally; PLAN.md explains why it exists.
